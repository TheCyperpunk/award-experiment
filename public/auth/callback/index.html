<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <title>Return to XMO</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d10;
      color: #ffffff;
    }
    main {
      width: min(28rem, calc(100% - 3rem));
      text-align: center;
    }
    .logo {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border-radius: 1rem;
      background: #ffffff;
      color: #080d10;
      font-size: 2rem;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      font-size: 1.9rem;
      line-height: 1.2;
    }
    p {
      margin: 1rem 0 0;
      color: rgba(255, 255, 255, 0.68);
      font-size: 1rem;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">X</div>
    <h1>Return to XMO</h1>
    <p>Open this link on the Android device where XMO is installed. If XMO did not open, update the app and try secure sign-in again.</p>
  </main>
</body>
</html>
